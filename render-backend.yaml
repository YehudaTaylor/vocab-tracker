# Backend-only deployment for Render
# This file should be used for the backend service only

services:
  - type: web
    name: vocab-tracker-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    env: node
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vocab-tracker-db
          property: connectionString
      - key: PORT
        value: 10000

databases:
  - name: vocab-tracker-db
    plan: free
    databaseName: vocab_tracker