# Minimal Render configuration for debugging
services:
  - type: web
    name: vocab-tracker-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci --production
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vocab-db
          property: connectionString

databases:
  - name: vocab-db
    plan: starter