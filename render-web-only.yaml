# Step 2: Deploy web service after database is ready
# IMPORTANT: Replace 'your-database-connection-string' with actual DATABASE_URL from Step 1
services:
  - type: web
    name: vocab-tracker-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --production
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        # Get this from your database service after Step 1
        value: "postgresql://username:password@host:port/database"
      - key: PORT
        value: 10000