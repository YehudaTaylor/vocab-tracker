version: 1.0
runtime: docker
build:
  commands:
    build:
      - echo "No build phase required for Docker"
run:
  runtime-version: latest
  command: docker-compose up
  network:
    port: 3000
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: DB_HOST
      value: your-rds-endpoint
    - name: DB_USER
      value: postgres
    - name: DB_PASSWORD
      value: your-password
    - name: DB_NAME
      value: vocab_tracker