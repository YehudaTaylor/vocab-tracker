# Simple Render deployment - Backend only
# Deploy frontend separately as static site

services:
  - type: web
    name: vocab-tracker-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vocab-tracker-db
          property: connectionString

databases:
  - name: vocab-tracker-db
    plan: free