services:
  # Backend API Service
  - type: web
    name: vocab-tracker-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && npm run migrate
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vocab-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH0_DOMAIN
        value: your-auth0-domain.auth0.com
      - key: AUTH0_AUDIENCE
        value: https://vocab-tracker-api
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: vocab-tracker-web
          property: host

  # Frontend Web Service  
  - type: web
    name: vocab-tracker-web
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: vocab-tracker-api
          property: host
      - key: REACT_APP_AUTH0_DOMAIN
        value: your-auth0-domain.auth0.com
      - key: REACT_APP_AUTH0_CLIENT_ID
        value: your-auth0-client-id
      - key: REACT_APP_AUTH0_AUDIENCE
        value: https://vocab-tracker-api

databases:
  - name: vocab-tracker-db
    plan: free