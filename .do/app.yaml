name: vocab-tracker
services:
- name: backend
  source_dir: /backend
  github:
    repo: your-username/vocab-tracker
    branch: develop
  run_command: npm start
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  envs:
  - key: NODE_ENV
    value: production
  - key: DB_HOST
    value: ${db.HOSTNAME}
  - key: DB_PORT
    value: ${db.PORT}
  - key: DB_NAME
    value: ${db.DATABASE}
  - key: DB_USER
    value: ${db.USERNAME}
  - key: DB_PASSWORD
    value: ${db.PASSWORD}
  - key: CORS_ORIGIN
    value: ${frontend.PUBLIC_URL}
  routes:
  - path: /api
- name: frontend
  source_dir: /frontend
  github:
    repo: your-username/vocab-tracker
    branch: develop
  build_command: npm run build
  run_command: serve -s build -p $PORT
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  routes:
  - path: /
databases:
- name: db
  engine: PG
  version: "15"